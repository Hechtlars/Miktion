<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Miktion">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Miktion</title>
  <style>
    :root{--bg:#f4f7fa;--card:#fff;--text:#17212b;--muted:#687684;--line:#dce3e9;--accent:#216a8c;--soft:#eaf4f8;--danger:#a43a3a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .app{max-width:720px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:27px;margin:0}.sub{color:var(--muted);font-size:14px}.gear{border:0;background:transparent;font-size:24px;padding:8px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(20,40,60,.04)}
    .progress{display:flex;gap:7px;margin-top:10px}.dot{height:8px;flex:1;border-radius:9px;background:#dfe6eb}.dot.on{background:var(--accent)}
    .actions{display:grid;gap:12px;margin:18px 0}.action{display:flex;align-items:center;gap:15px;width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:19px;text-align:left;font-size:18px;font-weight:650}.action span{font-size:29px}
    button{cursor:pointer}.smallbtn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 12px;font-weight:600}
    .primary{background:var(--accent);color:#fff;border:0}.danger{color:var(--danger)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{text-align:center;background:var(--soft);padding:12px 5px;border-radius:13px}.metric b{display:block;font-size:19px}.metric small{color:var(--muted)}
    .event{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.event:first-child{border-top:0}.time{font-weight:700;min-width:48px}.eventmain{flex:1}.eventmain small{color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(15,28,38,.35);display:none;align-items:flex-end;justify-content:center;z-index:20;overscroll-behavior:contain}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:white;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}body.modal-open{overflow:hidden;position:fixed;width:100%}.urgency-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:8px}.urgency-step{position:relative;border:0;background:transparent;padding:34px 2px 4px;font-size:11px;color:var(--muted);min-width:0}.urgency-step:before{content:'';position:absolute;top:14px;left:0;right:0;height:4px;background:var(--line)}.urgency-step:first-child:before{left:50%}.urgency-step:last-child:before{right:50%}.urgency-step:after{content:'';position:absolute;top:7px;left:50%;width:18px;height:18px;transform:translateX(-50%);border-radius:50%;background:white;border:3px solid #9aa7b2}.urgency-step.sel{color:var(--text);font-weight:700}.urgency-step.sel:after{background:var(--accent);border-color:var(--accent)}.sleep-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.sleep-row .sub{line-height:1.35}
    .sheet h2{margin:4px 0 16px}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:7px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px}.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
    input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.row{display:flex;gap:10px}.row>*{flex:1}.sheetfooter{display:flex;gap:10px;margin-top:18px}.sheetfooter button{flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);font-weight:700}
    .tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none!important}.note{font-size:12px;color:var(--muted);line-height:1.4}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:50}
    @media print{body{background:white}.app{max-width:none}.no-print,.actions,.gear{display:none!important}.card{box-shadow:none;break-inside:avoid}.printonly{display:block!important}}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottomnav>div{width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr)}.navbtn{border:0;background:transparent;color:var(--muted);padding:6px;font-size:11px;font-weight:650}.navbtn span{display:block;font-size:21px}.navbtn.active{color:var(--accent)}.view{display:none}.view.active{display:block}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.kpi small{color:var(--muted);display:block}.kpi b{font-size:21px}.chartbox{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;margin:12px 0}.bars{height:145px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding:8px}.bargrp{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}.bar{width:28%;background:#91b8c9;border-radius:5px 5px 0 0}.bar.alt{background:#4e8097}.barlabels{display:flex;gap:12px;padding:4px 8px}.barlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}.preview{background:#eef1f4;border-radius:15px;padding:12px}.paper{background:white;padding:18px;border-radius:4px;box-shadow:0 2px 8px #0002;font-size:12px}.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{padding:5px;border-bottom:1px solid #ddd;text-align:left}.compact-sleep{padding:0;overflow:hidden}.sleep-link{width:100%;border:0;background:transparent;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;color:inherit}.sleep-link>span:nth-child(2){flex:1}.sleep-link small{display:block;color:var(--muted);margin-top:2px}.sleep-icon{width:34px;height:34px;display:grid;place-items:center;color:var(--accent)}.sleep-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.chev{font-size:25px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Miktionstagebuch</h1><div class="sub" id="dateLabel"></div></div><button class="gear no-print" onclick="openSettings()">⚙️</button></header>

<div id="todayView" class="view active"><section class="card">
  <b id="dayTitle">Tag 1 von 3</b><div class="progress" id="progress"></div>
  <p class="sub" style="margin-bottom:0">Einträge dauern nur wenige Sekunden. Uhrzeit wird automatisch übernommen.</p>
</section>

<div class="actions no-print">
 <button class="action" onclick="openEntry('drink')"><span>💧</span><div>Trinkmenge</div></button>
 <button class="action" onclick="openEntry('void')"><span>🚽</span><div>Wasser gelassen<div class="sub">Menge & Drang</div></div></button>
 <button class="action" onclick="openEntry('leak')"><span>💦</span><div>Urin verloren<div class="sub">Menge, Situation & Vorlage</div></div></button>
</div>

<section class="card compact-sleep">
 <button class="sleep-link" onclick="openSleep()" aria-label="Nachtruhe eintragen oder bearbeiten">
  <span class="sleep-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></svg></span>
  <span><b>Nachtruhe</b><small id="sleepSummary">Noch nicht eingetragen</small></span><span class="chev">›</span>
 </button>
</section>


</div><div id="overviewView" class="view"><section class="card"><b>Übersicht</b><p class="sub">Tageswerte und dokumentierte Einträge im Überblick.</p><div id="dayOverview"></div></section></div><div id="analysisView" class="view"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Ärztliche Auswertung</b><div class="sub" id="analysisDays"></div></div><button class="smallbtn primary" onclick="reportPreview()">Arztbericht</button></div></section><div class="kpis" id="analysisKpis"></div><div class="chartbox"><b>Trinkmenge vs. Harnmenge</b><div class="bars" id="volumeBars"></div><div class="barlabels" id="volumeLabels"></div><div class="sub">Hell: Trinkmenge · Dunkel: Harnmenge</div></div><div class="chartbox"><b>Miktionen pro Tag</b><div class="bars" id="voidBars"></div><div class="barlabels" id="voidLabels"></div></div><section class="card"><b>Weitere Parameter</b><div class="sub" id="analysisDetails" style="line-height:1.7;margin-top:8px"></div></section></div></div><nav class="bottomnav no-print"><div><button class="navbtn active" data-view="today" onclick="showView('today')"><span>⌂</span>Heute</button><button class="navbtn" data-view="overview" onclick="showView('overview')"><span>▤</span>Übersicht</button><button class="navbtn" data-view="analysis" onclick="showView('analysis')"><span>▥</span>Auswertung</button></div></nav>

<div class="modal" id="modal" onclick="backdrop(event)"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='blasentagebuch.v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"start":"","entries":[],"sleep":{},"settings":{"days":3}}');
let selectedDate=new Date().toISOString().slice(0,10);
if(!db.start){db.start=selectedDate;localStorage.setItem(KEY,JSON.stringify(db));}
const labels={drink:'Trinkmenge',void:'Wasser gelassen',leak:'Urin verloren'};
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(s){return new Date(s+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function dayIndex(d){return Math.floor((new Date(d+'T12:00')-new Date(db.start+'T12:00'))/86400000)+1}
function render(){
 document.getElementById('dateLabel').textContent=fmtDate(selectedDate);
 let di=dayIndex(selectedDate),done=di>db.settings.days;
 document.getElementById('dayTitle').textContent=done?'Dokumentation abgeschlossen':`Tag ${Math.max(1,di)} von ${db.settings.days}`;
 document.getElementById('progress').innerHTML=Array.from({length:db.settings.days},(_,i)=>`<div class="dot ${i<Math.min(Math.max(di,0),db.settings.days)?'on':''}"></div>`).join('');
 let sl=db.sleep[selectedDate]; document.getElementById('sleepSummary').textContent=sl&&sl.bed&&sl.wake?`${sl.bed} – ${sl.wake}`:'Noch nicht eingetragen';
 renderDoctor();
}
function detail(x){
 if(x.type==='drink')return `${x.amount} ml${x.beverage?' · '+esc(x.beverage):''}`;
 if(x.type==='void')return `${x.amount} ml · Harndrang: ${esc(x.urgency||'nicht angegeben')}`;
 return `${esc(x.severity||'')} · ${esc(x.situation||'ohne Angabe')}${x.pad?' · Vorlage gewechselt':''}`;
}
function chips(name,vals){return `<div class="chips">${vals.map(v=>`<button type="button" class="chip" data-name="${name}" data-val="${v}" onclick="pick(this)">${v}</button>`).join('')}</div>`}
function pick(el){document.querySelectorAll(`[data-name="${el.dataset.name}"]`).forEach(x=>x.classList.remove('sel'));el.classList.add('sel');let i=document.querySelector(`[name="${el.dataset.name}"]`);if(i)i.value=el.dataset.val}
function now(){return new Date().toTimeString().slice(0,5)}
function amountChoices(){return `<div class="chips"><button type="button" class="chip" onclick="setAmount(this,150)">☕ 1 Tasse · ca. 150 ml</button><button type="button" class="chip" onclick="setAmount(this,200)">🥛 1 Glas · ca. 200 ml</button><button type="button" class="chip" onclick="setAmount(this,300)">🥛 1 großes Glas · ca. 300 ml</button></div><div class="sub" style="margin:12px 0 7px">Oder Menge in ml</div>${chips('amount',[100,150,200,250,300,500])}<input name="amount" type="number" inputmode="numeric" min="1" placeholder="andere Menge in ml" style="margin-top:8px">`}
function setAmount(el,val){document.querySelectorAll('[data-name="amount"],.field .chips .chip').forEach(x=>{if(x.closest('.field')===el.closest('.field'))x.classList.remove('sel')});el.classList.add('sel');document.querySelector('[name="amount"]').value=val}
function urgencyScale(){let vals=['keiner','leicht','mittel','stark','kaum aufzuhalten'];return `<div class="urgency-scale">${vals.map(v=>`<button type="button" class="urgency-step" data-val="${v}" onclick="pickUrgency(this)">${v}</button>`).join('')}</div><input name="urgency" type="hidden">`}
function pickUrgency(el){document.querySelectorAll('.urgency-step').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');document.querySelector('[name="urgency"]').value=el.dataset.val}
function openEntry(type){
 let body=`<h2>${labels[type]}</h2><div class="field"><label>Uhrzeit</label><input id="time" type="time" value="${now()}"></div>`;
 if(type==='drink')body+=`<div class="field"><label>Trinkmenge</label>${amountChoices()}</div><div class="field"><label>Getränk (optional)</label>${chips('beverage',['Wasser','Saftschorle','Kaffee','Tee','Alkohol','Anderes'])}<input name="beverage" type="hidden"></div>`;
 if(type==='void')body+=`<div class="field"><label>Harnmenge</label>${chips('amount',[50,100,150,200,250,300,400,500])}<input name="amount" type="number" inputmode="numeric" min="1" placeholder="andere Menge in ml" style="margin-top:8px"></div><div class="field"><label>Harndrang</label><div class="sub">Bitte auf der Skala auswählen</div>${urgencyScale()}</div>`;
 if(type==='leak')body+=`<div class="field"><label>Wie viel Urin?</label>${chips('severity',['wenig','mittel','viel'])}<input name="severity" type="hidden"></div><div class="field"><label>Situation</label>${chips('situation',['starker Harndrang','Husten/Niesen/Lachen','körperliche Belastung','ohne erkennbaren Auslöser','sonstiges'])}<input name="situation" type="hidden"></div><div class="field"><label><input id="pad" type="checkbox" style="width:auto"> Vorlage gewechselt</label></div>`;
 body+=`<div class="sheetfooter"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="add('${type}')">Speichern</button></div>`;
 show(body)
}
function add(type){
 let amount=document.querySelector('[name=amount]')?.value;
 if((type==='drink'||type==='void')&&!amount){toast('Bitte Menge angeben');return}
 let x={id:Date.now().toString(36),type,date:selectedDate,time:document.getElementById('time').value};
 ['amount','beverage','urgency','severity','situation'].forEach(k=>{let n=document.querySelector(`[name=${k}]`);if(n)x[k]=n.value});
 if(type==='leak')x.pad=document.getElementById('pad').checked;
 db.entries.push(x);closeModal();save();toast('Gespeichert')
}
function del(id){if(confirm('Eintrag wirklich löschen?')){db.entries=db.entries.filter(x=>x.id!==id);save()}}
let lockedScrollY=0;
function show(html){lockedScrollY=window.scrollY;document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open');document.body.classList.add('modal-open');document.body.style.top=`-${lockedScrollY}px`}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.classList.remove('modal-open');document.body.style.top='';window.scrollTo(0,lockedScrollY)}
function backdrop(e){if(e.target.id==='modal')closeModal()}
function openSleep(){
 let sl=db.sleep[selectedDate]||{};
 show(`<h2>Nachtruhe</h2><p class="sub">Die Zeiten helfen, nächtliche Toilettengänge und die nächtliche Urinmenge korrekt auszuwerten.</p><div class="row"><div class="field"><label>Zu Bett gegangen</label><input id="bed" type="time" value="${sl.bed||'22:30'}"></div><div class="field"><label>Aufgestanden</label><input id="wake" type="time" value="${sl.wake||'07:00'}"></div></div><div class="sheetfooter"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveSleep()">Speichern</button></div>`)
}
function saveSleep(){const bedEl=document.getElementById('bed'),wakeEl=document.getElementById('wake');db.sleep[selectedDate]={bed:bedEl.value,wake:wakeEl.value};closeModal();save();toast('Nachtruhe gespeichert')}
function changeDay(){
 let d=prompt('Datum wählen (JJJJ-MM-TT):',selectedDate); if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){selectedDate=d;render()}
}
function allDays(){return [...new Set(db.entries.map(x=>x.date))].sort()}
function stats(){let days=allDays(),n=Math.max(days.length,1),drink=0,urine=0,vc=0,leaks=0,pads=0,strong=0,max=0;db.entries.forEach(x=>{if(x.type==='drink')drink+=+x.amount||0;if(x.type==='void'){urine+=+x.amount||0;vc++;max=Math.max(max,+x.amount||0);if(['stark','kaum aufzuhalten'].includes(x.urgency))strong++}if(x.type==='leak'){leaks++;if(x.pad)pads++}});return{days,n,drink,urine,vc,leaks,pads,strong,max}}
function renderDoctor(){let a=stats(),k=[['Ø Trinkmenge',Math.round(a.drink/a.n)+' ml/Tag'],['Ø Miktionen',(a.vc/a.n).toFixed(1)+'/Tag'],['Ø Miktionsvolumen',a.vc?Math.round(a.urine/a.vc)+' ml':'0 ml'],['Max. Miktionsvolumen',a.max+' ml'],['Urinverlust',a.leaks+'×'],['Vorlagenwechsel',a.pads+'×']];document.getElementById('analysisDays').textContent=a.days.length+' dokumentierte Tage';document.getElementById('analysisKpis').innerHTML=k.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');document.getElementById('analysisDetails').innerHTML=`Starker/sehr starker Harndrang: <b>${a.strong}</b><br>Harnmenge gesamt: <b>${a.urine} ml</b><br>Trinkmenge gesamt: <b>${a.drink} ml</b>`;let v=a.days.map(d=>{let e=db.entries.filter(x=>x.date===d),dr=e.filter(x=>x.type==='drink').reduce((q,x)=>q+(+x.amount||0),0),ur=e.filter(x=>x.type==='void').reduce((q,x)=>q+(+x.amount||0),0),vc=e.filter(x=>x.type==='void').length;return{d,dr,ur,vc}}),mv=Math.max(1,...v.flatMap(x=>[x.dr,x.ur])),mc=Math.max(1,...v.map(x=>x.vc));document.getElementById('volumeBars').innerHTML=v.map(x=>`<div class="bargrp"><div class="bar" style="height:${Math.max(2,x.dr/mv*100)}%"></div><div class="bar alt" style="height:${Math.max(2,x.ur/mv*100)}%"></div></div>`).join('')||'<span class="sub">Noch keine Daten.</span>';document.getElementById('volumeLabels').innerHTML=v.map((x,i)=>`<span>Tag ${i+1}</span>`).join('');document.getElementById('voidBars').innerHTML=v.map(x=>`<div class="bargrp"><div class="bar alt" style="width:32%;height:${Math.max(2,x.vc/mc*100)}%"></div></div>`).join('')||'<span class="sub">Noch keine Daten.</span>';document.getElementById('voidLabels').innerHTML=v.map((x,i)=>`<span>Tag ${i+1}</span>`).join('');document.getElementById('dayOverview').innerHTML=v.map(x=>{let e=db.entries.filter(y=>y.date===x.d),le=e.filter(y=>y.type==='leak').length,pa=e.filter(y=>y.type==='leak'&&y.pad).length;return `<div class="event"><div class="eventmain"><b>${fmtDate(x.d)}</b><br><small>💧 ${x.dr} ml · 🚽 ${x.vc}× · 💦 ${le}× · Vorlagen ${pa}×</small></div><button class="smallbtn" onclick="selectedDate='${x.d}';showView('today');render()">Öffnen</button></div>`}).join('')||'<p class="sub">Noch keine Daten.</p>'}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');document.querySelector(`[data-view="${v}"]`).classList.add('active');document.querySelector('h1').textContent=v==='today'?'Miktionstagebuch':v==='overview'?'Übersicht':'Auswertung';window.scrollTo(0,0)}
function reportPreview(){let a=stats(),rows=a.days.map(d=>{let e=db.entries.filter(x=>x.date===d),dr=e.filter(x=>x.type==='drink').reduce((q,x)=>q+(+x.amount||0),0),vs=e.filter(x=>x.type==='void'),ur=vs.reduce((q,x)=>q+(+x.amount||0),0),le=e.filter(x=>x.type==='leak').length,pa=e.filter(x=>x.type==='leak'&&x.pad).length;return `<tr><td>${fmtDate(d)}</td><td>${dr} ml</td><td>${vs.length}</td><td>${ur} ml</td><td>${le}</td><td>${pa}</td></tr>`}).join('');let rep=`<h2>Miktionstagebuch</h2><p>${a.days.length} dokumentierte Tage</p><p><b>Ø Trinkmenge:</b> ${Math.round(a.drink/a.n)} ml/Tag · <b>Ø Miktionen:</b> ${(a.vc/a.n).toFixed(1)}/Tag · <b>Ø Miktionsvolumen:</b> ${a.vc?Math.round(a.urine/a.vc):0} ml</p><table><tr><th>Tag</th><th>Trinken</th><th>Miktionen</th><th>Harnmenge</th><th>Urinverlust</th><th>Vorlagen</th></tr>${rows}</table><p>Starker/sehr starker Harndrang: ${a.strong} · Maximum: ${a.max} ml</p>`;show(`<h2>PDF-Vorschau</h2><div class="preview"><div class="paper">${rep}</div></div><p class="note">Beim Versand per normaler E-Mail können Gesundheitsdaten unverschlüsselt übertragen werden.</p><div class="sheetfooter"><button onclick="closeModal()">Zurück</button><button onclick="emailReport()">Per E-Mail</button><button class="primary" onclick="window.print()">PDF speichern / teilen</button></div>`)}
function emailReport(){location.href='mailto:?subject='+encodeURIComponent('Miktionstagebuch')+'&body='+encodeURIComponent('Guten Tag,\n\nich möchte Ihnen mein Miktionstagebuch übermitteln. Bitte fügen Sie die gespeicherte PDF-Datei in Ihrer Mail-App als Anhang hinzu.')}
function printReport(){reportPreview()}
function exportData(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='blasentagebuch-sicherung.json';a.click();URL.revokeObjectURL(a.href)
}
function openSettings(){
 show(`<h2>Einstellungen</h2><div class="field"><label>Dokumentationsdauer</label><select id="days"><option value="3" ${db.settings.days==3?'selected':''}>3 Tage</option><option value="4" ${db.settings.days==4?'selected':''}>4 Tage</option><option value="7" ${db.settings.days==7?'selected':''}>7 Tage</option></select></div><div class="field"><label>Startdatum</label><input id="start" type="date" value="${db.start}"></div><div class="field"><label>Sicherung importieren</label><input id="importFile" type="file" accept=".json"></div><div class="field" style="margin-top:28px;padding-top:20px;border-top:1px solid var(--line)"><label>Tagebuch zurücksetzen</label><p class="sub">Löscht alle Einträge und Nachtruhe-Daten, damit ein neues Miktionstagebuch begonnen werden kann.</p><button class="danger" style="width:100%" onclick="confirmResetDiary()">Tagebuch löschen & neu beginnen</button></div><div class="sheetfooter"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveSettings()">Speichern</button></div>`)
}
function confirmResetDiary(){
 show(`<h2>Tagebuch wirklich löschen?</h2><p>Alle Einträge und Nachtruhe-Daten des aktuellen Miktionstagebuchs werden dauerhaft von diesem Gerät gelöscht.</p><p class="sub">Die Dokumentationsdauer bleibt erhalten. Das neue Tagebuch startet heute bei Tag 1.</p><div class="field"><button onclick="exportData()" style="width:100%">Vorher Sicherung exportieren</button></div><div class="sheetfooter"><button onclick="openSettings()">Abbrechen</button><button class="danger" onclick="resetDiary()">Tagebuch löschen & neu beginnen</button></div>`)
}
function resetDiary(){
 const keepDays=(db.settings&&db.settings.days)||3;
 const today=isoToday();
 db={start:today,entries:[],sleep:{},settings:{days:keepDays}};
 selectedDate=today;
 localStorage.setItem(KEY,JSON.stringify(db));
 closeModal();
 showView('today');
 render();
 toast('Neues Miktionstagebuch gestartet');
}
function saveSettings(){
 db.settings.days=+days.value;db.start=start.value||db.start;
 let f=importFile.files[0]; if(f){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();closeModal()}catch(e){toast('Sicherung ungültig')}};r.readAsText(f);return}
 closeModal();save()
}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
render();
</script>
</body></html>
