<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Miktion">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Miktion</title>
  <style>
    :root{--bg:#f4f7fa;--card:#fff;--text:#17212b;--muted:#687684;--line:#dce3e9;--accent:#216a8c;--soft:#eaf4f8;--danger:#a43a3a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .app{max-width:720px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:27px;margin:0}.sub{color:var(--muted);font-size:14px}.gear{border:0;background:transparent;font-size:24px;padding:8px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(20,40,60,.04)}
    .progress{display:flex;gap:7px;margin-top:10px}.dot{height:8px;flex:1;border-radius:9px;background:#dfe6eb}.dot.on{background:var(--accent)}
    .actions{display:grid;gap:12px;margin:18px 0}.action{display:flex;align-items:center;gap:15px;width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:19px;text-align:left;font-size:18px;font-weight:650}.action span{font-size:29px}
    button{cursor:pointer}.smallbtn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 12px;font-weight:600}
    .primary{background:var(--accent);color:#fff;border:0}.danger{color:var(--danger)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{text-align:center;background:var(--soft);padding:12px 5px;border-radius:13px}.metric b{display:block;font-size:19px}.metric small{color:var(--muted)}
    .event{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.event:first-child{border-top:0}.time{font-weight:700;min-width:48px}.eventmain{flex:1}.eventmain small{color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(15,28,38,.35);display:none;align-items:flex-end;justify-content:center;z-index:20;overscroll-behavior:contain}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:white;border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}body.modal-open{overflow:hidden;position:fixed;width:100%}.urgency-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:8px}.urgency-step{position:relative;border:0;background:transparent;padding:34px 2px 4px;font-size:11px;color:var(--muted);min-width:0}.urgency-step:before{content:'';position:absolute;top:14px;left:0;right:0;height:4px;background:var(--line)}.urgency-step:first-child:before{left:50%}.urgency-step:last-child:before{right:50%}.urgency-step:after{content:'';position:absolute;top:7px;left:50%;width:18px;height:18px;transform:translateX(-50%);border-radius:50%;background:white;border:3px solid #9aa7b2}.urgency-step.sel{color:var(--text);font-weight:700}.urgency-step.sel:after{background:var(--accent);border-color:var(--accent)}.sleep-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.sleep-row .sub{line-height:1.35}
    .sheet h2{margin:4px 0 16px}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:7px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px}.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
    input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.row{display:flex;gap:10px}.row>*{flex:1}.sheetfooter{display:flex;gap:10px;margin-top:18px}.sheetfooter button{flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);font-weight:700}
    .tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none!important}.note{font-size:12px;color:var(--muted);line-height:1.4}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:50}
    @media print{body{background:white}.app{max-width:none}.no-print,.actions,.gear{display:none!important}.card{box-shadow:none;break-inside:avoid}.printonly{display:block!important}}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottomnav>div{width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr)}.navbtn{border:0;background:transparent;color:var(--muted);padding:6px;font-size:11px;font-weight:650}.navbtn span{display:block;font-size:21px}.navbtn.active{color:var(--accent)}.view{display:none}.view.active{display:block}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.kpi small{color:var(--muted);display:block}.kpi b{font-size:21px}.chartbox{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;margin:12px 0}.bars{height:145px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding:8px}.bargrp{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}.bar{width:28%;background:#91b8c9;border-radius:5px 5px 0 0}.bar.alt{background:#4e8097}.barlabels{display:flex;gap:12px;padding:4px 8px}.barlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}.preview{background:#eef1f4;border-radius:15px;padding:12px}.paper{background:white;padding:18px;border-radius:4px;box-shadow:0 2px 8px #0002;font-size:12px}.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{padding:5px;border-bottom:1px solid #ddd;text-align:left}.compact-sleep{padding:0;overflow:hidden}.sleep-link{width:100%;border:0;background:transparent;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;color:inherit}.sleep-link>span:nth-child(2){flex:1}.sleep-link small{display:block;color:var(--muted);margin-top:2px}.sleep-icon{width:34px;height:34px;display:grid;place-items:center;color:var(--accent)}.sleep-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.chev{font-size:25px;color:var(--muted)}
.resetlead{font-size:17px;line-height:1.45}.backupbtn{width:100%;background:#fff!important;border:1.5px solid var(--accent)!important;color:var(--accent)!important;font-weight:650}.resetactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.resetactions button{min-height:52px;font-size:16px;font-weight:650}.resetdanger{background:#fff5f5!important;border:1.5px solid #b33a3a!important;color:#a72f2f!important}@media(max-width:380px){.resetactions{grid-template-columns:1fr}.resetactions button{width:100%}}
.today-progress{padding:6px 2px 18px}.today-progress-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.today-progress-head b{display:block;font-size:21px;letter-spacing:-.25px;margin-top:3px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.08em;color:var(--muted)}.status-pill{font-size:12px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,white);border-radius:999px;padding:5px 9px}.today-progress .progress{margin-top:12px}.entry-section{margin-top:2px}.section-title{font-size:14px;font-weight:750;margin:0 2px 9px;color:#35424a}.entry-list,.sleep-section{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.entry-row{width:100%;min-height:72px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff;padding:13px 15px;display:flex;align-items:center;gap:13px;text-align:left;color:inherit}.entry-row:last-child{border-bottom:0}.entry-row:active{background:#f7fafb}.entry-icon{width:38px;height:38px;border-radius:11px;background:#f1f6f7;color:var(--accent);display:grid;place-items:center;flex:0 0 38px}.entry-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.entry-copy{flex:1;min-width:0}.entry-copy b{display:block;font-size:16px}.entry-copy small{display:block;color:var(--muted);font-size:13px;margin-top:2px}.primary-entry .entry-icon{background:var(--accent);color:#fff}.sleep-section{margin-top:14px}.sleep-clean{min-height:64px}.sleep-clean .entry-icon{background:transparent}.chev{font-size:24px;color:#8b989f;font-weight:400}.actions{display:none!important}
.settings-group{margin:24px 0 8px;padding-top:18px;border-top:1px solid var(--line)}.settings-group>label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}.settings-link{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);padding:14px 15px}.settings-link:first-of-type{border-radius:14px 14px 0 0}.settings-link:last-of-type{border-top:0;border-radius:0 0 14px 14px}.settings-link>span:first-child{flex:1}.settings-link b,.settings-link small{display:block}.settings-link small{color:var(--muted);font-size:12px;margin-top:3px}.qstep{font-size:12px;font-weight:750;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}.qchoices{display:grid;gap:9px;margin:18px 0}.qchoice{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:15px;line-height:1.35}.qchoice input{width:20px!important;height:20px;margin:0;flex:0 0 20px}.qsummary{display:grid;gap:10px;margin:16px 0}.qsummary>div{padding:12px;background:var(--soft);border-radius:12px}.qsummary small,.qsummary b{display:block}.qsummary small{color:var(--muted);margin-bottom:4px}.info-block{padding:14px 0;border-top:1px solid var(--line)}.info-block h3{font-size:17px;margin:0 0 7px}.info-block p,.info-block li{font-size:14px;line-height:1.5}.info-block ul{padding-left:20px;margin-bottom:0}.medical-note{background:#f4f7f8;border-radius:12px;padding:12px;font-size:13px;line-height:1.45}.report-q p{margin:8px 0}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Miktionstagebuch</h1><div class="sub" id="dateLabel"></div></div><button class="gear no-print" onclick="openSettings()"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg></button></header>

<div id="todayView" class="view active">
<section class="today-progress">
 <div class="today-progress-head"><div><span class="eyebrow">DOKUMENTATION</span><b id="dayTitle">Tag 1 von 3</b></div><span class="status-pill">läuft</span></div>
 <div class="progress" id="progress"></div>
</section>

<section class="entry-section no-print">
 <div class="section-title">Eintrag hinzufügen</div>
 <div class="entry-list">
  <button class="entry-row primary-entry" onclick="openEntry('void')">
   <span class="entry-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5s5 6 5 10.8a5 5 0 0 1-10 0C7 8.5 12 2.5 12 2.5z"/><path d="M9.5 14.3c.5 1.2 1.4 2 2.8 2.2"/></svg></span><span class="entry-copy"><b>Wasser gelassen</b><small>Menge &amp; Drang</small></span><span class="chev">›</span>
  </button>
  <button class="entry-row" onclick="openEntry('drink')">
   <span class="entry-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-1 17H8L7 3z"/><path d="M8 8h8"/><path d="M9 12c2 1 4-1 6 0"/></svg></span><span class="entry-copy"><b>Trinkmenge</b><small>Getränk &amp; Menge</small></span><span class="chev">›</span>
  </button>
  <button class="entry-row" onclick="openEntry('leak')">
   <span class="entry-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4S4 8.5 4 12a4 4 0 0 0 8 0C12 8.5 8 4 8 4z"/><path d="M17 9s-3 3.4-3 6a3 3 0 0 0 6 0c0-2.6-3-6-3-6z"/></svg></span><span class="entry-copy"><b>Urin verloren</b><small>Menge, Situation &amp; Vorlage</small></span><span class="chev">›</span>
  </button>
 </div>
</section>

<section class="sleep-section">
 <button class="entry-row sleep-clean" onclick="openSleep()" aria-label="Nachtruhe eintragen oder bearbeiten">
  <span class="entry-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></svg></span><span class="entry-copy"><b>Nachtruhe</b><small id="sleepSummary">Noch nicht eingetragen</small></span><span class="chev">›</span>
 </button>
</section>
</div><div id="overviewView" class="view"><section class="card"><b>Übersicht</b><p class="sub">Tageswerte und dokumentierte Einträge im Überblick.</p><div id="dayOverview"></div></section></div><div id="analysisView" class="view"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Ärztliche Auswertung</b><div class="sub" id="analysisDays"></div></div><button class="smallbtn primary" onclick="reportPreview()">Arztbericht</button></div></section><div class="kpis" id="analysisKpis"></div><div class="chartbox"><b>Trinkmenge vs. Harnmenge</b><div class="bars" id="volumeBars"></div><div class="barlabels" id="volumeLabels"></div><div class="sub">Hell: Trinkmenge · Dunkel: Harnmenge</div></div><div class="chartbox"><b>Miktionen pro Tag</b><div class="bars" id="voidBars"></div><div class="barlabels" id="voidLabels"></div></div><section class="card"><b>Weitere Parameter</b><div class="sub" id="analysisDetails" style="line-height:1.7;margin-top:8px"></div></section></div></div><nav class="bottomnav no-print"><div><button class="navbtn active" data-view="today" onclick="showView('today')"><span>⌂</span>Heute</button><button class="navbtn" data-view="overview" onclick="showView('overview')"><span>▤</span>Übersicht</button><button class="navbtn" data-view="analysis" onclick="showView('analysis')"><span>▥</span>Auswertung</button></div></nav>

<div class="modal" id="modal" onclick="backdrop(event)"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='blasentagebuch.v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"start":"","entries":[],"sleep":{},"settings":{"days":3}}');
let selectedDate=new Date().toISOString().slice(0,10);
if(!db.start){db.start=selectedDate;} if(!db.questionnaire)db.questionnaire={}; localStorage.setItem(KEY,JSON.stringify(db));
const labels={drink:'Trinkmenge',void:'Wasser gelassen',leak:'Urin verloren'};
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(s){return new Date(s+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function dayIndex(d){return Math.floor((new Date(d+'T12:00')-new Date(db.start+'T12:00'))/86400000)+1}
function render(){
 document.getElementById('dateLabel').textContent=fmtDate(selectedDate);
 let di=dayIndex(selectedDate),done=di>db.settings.days;
 document.getElementById('dayTitle').textContent=done?'Dokumentation abgeschlossen':`Tag ${Math.max(1,di)} von ${db.settings.days}`;
 document.getElementById('progress').innerHTML=Array.from({length:db.settings.days},(_,i)=>`<div class="dot ${i<Math.min(Math.max(di,0),db.settings.days)?'on':''}"></div>`).join('');
 let sl=db.sleep[selectedDate]; document.getElementById('sleepSummary').textContent=sl&&sl.bed&&sl.wake?`${sl.bed} – ${sl.wake}`:'Noch nicht eingetragen';
 renderDoctor();
}
function detail(x){
 if(x.type==='drink')return `${x.amount} ml${x.beverage?' · '+esc(x.beverage):''}`;
 if(x.type==='void')return `${x.amount} ml · Harndrang: ${esc(x.urgency||'nicht angegeben')}`;
 return `${esc(x.severity||'')} · ${esc(x.situation||'ohne Angabe')}${x.pad?' · Vorlage gewechselt':''}`;
}
function chips(name,vals){return `<div class="chips">${vals.map(v=>`<button type="button" class="chip" data-name="${name}" data-val="${v}" onclick="pick(this)">${v}</button>`).join('')}</div>`}
function pick(el){document.querySelectorAll(`[data-name="${el.dataset.name}"]`).forEach(x=>x.classList.remove('sel'));el.classList.add('sel');let i=document.querySelector(`[name="${el.dataset.name}"]`);if(i)i.value=el.dataset.val}
function now(){return new Date().toTimeString().slice(0,5)}
function amountChoices(){return `<div class="chips"><button type="button" class="chip" onclick="setAmount(this,150)">☕ 1 Tasse · ca. 150 ml</button><button type="button" class="chip" onclick="setAmount(this,200)">🥛 1 Glas · ca. 200 ml</button><button type="button" class="chip" onclick="setAmount(this,300)">🥛 1 großes Glas · ca. 300 ml</button></div><div class="sub" style="margin:12px 0 7px">Oder Menge in ml</div>${chips('amount',[100,150,200,250,300,500])}<input name="amount" type="number" inputmode="numeric" min="1" placeholder="andere Menge in ml" style="margin-top:8px">`}
function setAmount(el,val){document.querySelectorAll('[data-name="amount"],.field .chips .chip').forEach(x=>{if(x.closest('.field')===el.closest('.field'))x.classList.remove('sel')});el.classList.add('sel');document.querySelector('[name="amount"]').value=val}
function urgencyScale(){let vals=['keiner','leicht','mittel','stark','kaum aufzuhalten'];return `<div class="urgency-scale">${vals.map(v=>`<button type="button" class="urgency-step" data-val="${v}" onclick="pickUrgency(this)">${v}</button>`).join('')}</div><input name="urgency" type="hidden">`}
function pickUrgency(el){document.querySelectorAll('.urgency-step').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');document.querySelector('[name="urgency"]').value=el.dataset.val}
function openEntry(type){
 let body=`<h2>${labels[type]}</h2><div class="field"><label>Uhrzeit</label><input id="time" type="time" value="${now()}"></div>`;
 if(type==='drink')body+=`<div class="field"><label>Trinkmenge</label>${amountChoices()}</div><div class="field"><label>Getränk (optional)</label>${chips('beverage',['Wasser','Saftschorle','Kaffee','Tee','Alkohol','Anderes'])}<input name="beverage" type="hidden"></div>`;
 if(type==='void')body+=`<div class="field"><label>Harnmenge</label>${chips('amount',[50,100,150,200,250,300,400,500])}<input name="amount" type="number" inputmode="numeric" min="1" placeholder="andere Menge in ml" style="margin-top:8px"></div><div class="field"><label>Harndrang</label><div class="sub">Bitte auf der Skala auswählen</div>${urgencyScale()}</div>`;
 if(type==='leak')body+=`<div class="field"><label>Wie viel Urin?</label>${chips('severity',['wenig','mittel','viel'])}<input name="severity" type="hidden"></div><div class="field"><label>Situation</label>${chips('situation',['starker Harndrang','Husten/Niesen/Lachen','körperliche Belastung','ohne erkennbaren Auslöser','sonstiges'])}<input name="situation" type="hidden"></div><div class="field"><label><input id="pad" type="checkbox" style="width:auto"> Vorlage gewechselt</label></div>`;
 body+=`<div class="sheetfooter"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="add('${type}')">Speichern</button></div>`;
 show(body)
}
function add(type){
 let amount=document.querySelector('[name=amount]')?.value;
 if((type==='drink'||type==='void')&&!amount){toast('Bitte Menge angeben');return}
 let x={id:Date.now().toString(36),type,date:selectedDate,time:document.getElementById('time').value};
 ['amount','beverage','urgency','severity','situation'].forEach(k=>{let n=document.querySelector(`[name=${k}]`);if(n)x[k]=n.value});
 if(type==='leak')x.pad=document.getElementById('pad').checked;
 db.entries.push(x);closeModal();save();toast('Gespeichert')
}
function del(id){if(confirm('Eintrag wirklich löschen?')){db.entries=db.entries.filter(x=>x.id!==id);save()}}
let lockedScrollY=0;
function show(html){lockedScrollY=window.scrollY;document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open');document.body.classList.add('modal-open');document.body.style.top=`-${lockedScrollY}px`}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.classList.remove('modal-open');document.body.style.top='';window.scrollTo(0,lockedScrollY)}
function backdrop(e){if(e.target.id==='modal')closeModal()}
function openSleep(){
 let sl=db.sleep[selectedDate]||{};
 show(`<h2>Nachtruhe</h2><p class="sub">Die Zeiten helfen, nächtliche Toilettengänge und die nächtliche Urinmenge korrekt auszuwerten.</p><div class="row"><div class="field"><label>Zu Bett gegangen</label><input id="bed" type="time" value="${sl.bed||'22:30'}"></div><div class="field"><label>Aufgestanden</label><input id="wake" type="time" value="${sl.wake||'07:00'}"></div></div><div class="sheetfooter"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveSleep()">Speichern</button></div>`)
}
function saveSleep(){const bedEl=document.getElementById('bed'),wakeEl=document.getElementById('wake');db.sleep[selectedDate]={bed:bedEl.value,wake:wakeEl.value};closeModal();save();toast('Nachtruhe gespeichert')}
function changeDay(){
 let d=prompt('Datum wählen (JJJJ-MM-TT):',selectedDate); if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){selectedDate=d;render()}
}
function allDays(){return [...new Set(db.entries.map(x=>x.date))].sort()}
function stats(){let days=allDays(),n=Math.max(days.length,1),drink=0,urine=0,vc=0,leaks=0,pads=0,strong=0,max=0;db.entries.forEach(x=>{if(x.type==='drink')drink+=+x.amount||0;if(x.type==='void'){urine+=+x.amount||0;vc++;max=Math.max(max,+x.amount||0);if(['stark','kaum aufzuhalten'].includes(x.urgency))strong++}if(x.type==='leak'){leaks++;if(x.pad)pads++}});return{days,n,drink,urine,vc,leaks,pads,strong,max}}
function renderDoctor(){let a=stats(),k=[['Ø Trinkmenge',Math.round(a.drink/a.n)+' ml/Tag'],['Ø Miktionen',(a.vc/a.n).toFixed(1)+'/Tag'],['Ø Miktionsvolumen',a.vc?Math.round(a.urine/a.vc)+' ml':'0 ml'],['Max. Miktionsvolumen',a.max+' ml'],['Ø Urinverlust',(a.leaks/a.n).toFixed(1)+'×/Tag'],['Ø Vorlagenwechsel',(a.pads/a.n).toFixed(1)+'×/Tag']];document.getElementById('analysisDays').textContent=a.days.length+' dokumentierte Tage';document.getElementById('analysisKpis').innerHTML=k.map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');document.getElementById('analysisDetails').innerHTML=`Starker/sehr starker Harndrang: <b>${a.strong}</b><br>Harnmenge gesamt: <b>${a.urine} ml</b><br>Trinkmenge gesamt: <b>${a.drink} ml</b>`;let v=a.days.map(d=>{let e=db.entries.filter(x=>x.date===d),dr=e.filter(x=>x.type==='drink').reduce((q,x)=>q+(+x.amount||0),0),ur=e.filter(x=>x.type==='void').reduce((q,x)=>q+(+x.amount||0),0),vc=e.filter(x=>x.type==='void').length;return{d,dr,ur,vc}}),mv=Math.max(1,...v.flatMap(x=>[x.dr,x.ur])),mc=Math.max(1,...v.map(x=>x.vc));document.getElementById('volumeBars').innerHTML=v.map(x=>`<div class="bargrp"><div class="bar" style="height:${Math.max(2,x.dr/mv*100)}%"></div><div class="bar alt" style="height:${Math.max(2,x.ur/mv*100)}%"></div></div>`).join('')||'<span class="sub">Noch keine Daten.</span>';document.getElementById('volumeLabels').innerHTML=v.map((x,i)=>`<span>Tag ${i+1}</span>`).join('');document.getElementById('voidBars').innerHTML=v.map(x=>`<div class="bargrp"><div class="bar alt" style="width:32%;height:${Math.max(2,x.vc/mc*100)}%"></div></div>`).join('')||'<span class="sub">Noch keine Daten.</span>';document.getElementById('voidLabels').innerHTML=v.map((x,i)=>`<span>Tag ${i+1}</span>`).join('');document.getElementById('dayOverview').innerHTML=v.map(x=>{let e=db.entries.filter(y=>y.date===x.d),le=e.filter(y=>y.type==='leak').length,pa=e.filter(y=>y.type==='leak'&&y.pad).length;return `<div class="event"><div class="eventmain"><b>${fmtDate(x.d)}</b><br><small>💧 ${x.dr} ml · 🚽 ${x.vc}× · 💦 ${le}× · Vorlagen ${pa}×</small></div><button class="smallbtn" onclick="selectedDate='${x.d}';showView('today');render()">Öffnen</button></div>`}).join('')||'<p class="sub">Noch keine Daten.</p>'}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');document.querySelector(`[data-view="${v}"]`).classList.add('active');document.querySelector('h1').textContent=v==='today'?'Miktionstagebuch':v==='overview'?'Übersicht':'Auswertung';window.scrollTo(0,0)}
function reportPreview(){let a=stats(),rows=a.days.map(d=>{let e=db.entries.filter(x=>x.date===d),dr=e.filter(x=>x.type==='drink').reduce((q,x)=>q+(+x.amount||0),0),vs=e.filter(x=>x.type==='void'),ur=vs.reduce((q,x)=>q+(+x.amount||0),0),le=e.filter(x=>x.type==='leak').length,pa=e.filter(x=>x.type==='leak'&&x.pad).length;return `<tr><td>${fmtDate(d)}</td><td>${dr} ml</td><td>${vs.length}</td><td>${ur} ml</td><td>${le}</td><td>${pa}</td></tr>`}).join('');let q=db.questionnaire||{},qrep=q.completed?`<h3>Kontinenz-Fragebogen</h3><div class="report-q">${cq.map(x=>`<p><b>${x.q}</b><br>${esc(Array.isArray(q[x.key])?q[x.key].join(' · '):(q[x.key]||'–'))}</p>`).join('')}</div>`:'';let rep=`<h2>Miktionstagebuch</h2><p>${a.days.length} dokumentierte Tage</p><p><b>Ø Trinkmenge:</b> ${Math.round(a.drink/a.n)} ml/Tag · <b>Ø Miktionen:</b> ${(a.vc/a.n).toFixed(1)}/Tag · <b>Ø Miktionsvolumen:</b> ${a.vc?Math.round(a.urine/a.vc):0} ml</p><table><tr><th>Tag</th><th>Trinken</th><th>Miktionen</th><th>Harnmenge</th><th>Urinverlust</th><th>Vorlagen</th></tr>${rows}</table><p>Starker/sehr starker Harndrang: ${a.strong} · Maximum: ${a.max} ml</p>${qrep}`;show(`<h2>PDF-Vorschau</h2><div class="preview"><div class="paper">${rep}</div></div><p class="note">Beim Versand per normaler E-Mail können Gesundheitsdaten unverschlüsselt übertragen werden.</p><div class="sheetfooter"><button onclick="closeModal()">Zurück</button><button onclick="emailReport()">Per E-Mail</button><button class="primary" onclick="window.print()">PDF speichern / teilen</button></div>`)}
function emailReport(){location.href='mailto:?subject='+encodeURIComponent('Miktionstagebuch')+'&body='+encodeURIComponent('Guten Tag,\n\nich möchte Ihnen mein Miktionstagebuch übermitteln. Bitte fügen Sie die gespeicherte PDF-Datei in Ihrer Mail-App als Anhang hinzu.')}
function printReport(){reportPreview()}
function exportData(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='blasentagebuch-sicherung.json';a.click();URL.revokeObjectURL(a.href)
}
function openSettings(){
 show(`<h2>Einstellungen</h2><div class="field"><label>Dokumentationsdauer</label><select id="days"><option value="3" ${db.settings.days==3?'selected':''}>3 Tage</option><option value="4" ${db.settings.days==4?'selected':''}>4 Tage</option><option value="7" ${db.settings.days==7?'selected':''}>7 Tage</option></select></div><div class="field"><label>Startdatum</label><input id="start" type="date" value="${db.start}"></div><div class="field"><label>Sicherung importieren</label><input id="importFile" type="file" accept=".json"></div>
<div class="settings-group"><label>Kontinenz</label>
<button class="settings-link" onclick="openQuestionnaire(0)"><span><b>Kontinenz-Fragebogen</b><small>${db.questionnaire&&db.questionnaire.completed?'Ausgefüllt – Antworten ansehen':'Schritt für Schritt ausfüllen'}</small></span><span class="chev">›</span></button>
<button class="settings-link" onclick="openContinenceInfo()"><span><b>Hauptursachen &amp; Tipps</b><small>Informationen aus dem Kontinenz-Protokoll</small></span><span class="chev">›</span></button>
</div>
<div class="field" style="margin-top:28px;padding-top:20px;border-top:1px solid var(--line)"><label>Tagebuch zurücksetzen</label><p class="sub">Löscht alle Einträge und Nachtruhe-Daten, damit ein neues Miktionstagebuch begonnen werden kann.</p><button class="danger" style="width:100%" onclick="confirmResetDiary()">Tagebuch löschen & neu beginnen</button></div><div class="sheetfooter"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="saveSettings()">Speichern</button></div>`)
}

const cq=[
 {key:'frequency',q:'Wie oft kommt es bei Ihnen zu unwillkürlichem Urinverlust?',type:'single',a:['Nie','Einmal pro Woche oder seltener','Zwei- bis dreimal pro Woche','Einmal täglich','Mehrmals täglich','Ständig']},
 {key:'amount',q:'Wie hoch ist der Urinverlust?',type:'single',a:['Kein Urinverlust','Eine geringe Menge','Eine mittelgroße Menge','Eine große Menge']},
 {key:'impact',q:'Wie stark ist Ihr Leben durch den Urinverlust beeinträchtigt?',type:'single',a:['0 – gar nicht','1','2','3','4 – stark']},
 {key:'when',q:'Wann kommt es zu Urinverlust?',type:'multi',a:['Zu keiner Zeit','Bevor Sie die Toilette erreichen können','Beim Husten, Niesen, Laufen usw.','Im Schlaf','Bei körperlicher Anstrengung und Sport','Nach dem Wasserlassen','Aus keinem ersichtlichen Grund','Urinverlust tritt ständig auf']}
];
function openQuestionnaire(i=0){
 if(!db.questionnaire)db.questionnaire={};
 const x=cq[i],old=db.questionnaire[x.key],isMulti=x.type==='multi';
 const choices=x.a.map(v=>`<label class="qchoice"><input type="${isMulti?'checkbox':'radio'}" name="qanswer" value="${esc(v)}" ${isMulti&&Array.isArray(old)&&old.includes(v)||!isMulti&&old===v?'checked':''}><span>${esc(v)}</span></label>`).join('');
 show(`<div class="qstep">Frage ${i+1} von ${cq.length}</div><h2>${x.q}</h2><div class="qchoices">${choices}</div><div class="sheetfooter"><button onclick="${i?'openQuestionnaire('+(i-1)+')':'openSettings()'}">${i?'Zurück':'Abbrechen'}</button><button class="primary" onclick="saveQuestionnaireStep(${i})">${i===cq.length-1?'Abschließen':'Weiter'}</button></div>`);
}
function saveQuestionnaireStep(i){
 const x=cq[i],els=[...document.querySelectorAll('[name=qanswer]:checked')];
 if(!els.length){toast('Bitte eine Antwort auswählen');return}
 db.questionnaire[x.key]=x.type==='multi'?els.map(e=>e.value):els[0].value;
 if(i===cq.length-1){db.questionnaire.completed=true;db.questionnaire.completedAt=new Date().toISOString();save();showQuestionnaireSummary()}else{localStorage.setItem(KEY,JSON.stringify(db));openQuestionnaire(i+1)}
}
function showQuestionnaireSummary(){
 const q=db.questionnaire||{};
 show(`<div class="qstep">Kontinenz-Fragebogen</div><h2>Antworten gespeichert</h2>
 <div class="qsummary">${cq.map(x=>`<div><small>${x.q}</small><b>${esc(Array.isArray(q[x.key])?q[x.key].join(' · '):(q[x.key]||'–'))}</b></div>`).join('')}</div>
 <p class="sub">Der Fragebogen dient der strukturierten Dokumentation und stellt keine Diagnose.</p>
 <div class="sheetfooter"><button onclick="openSettings()">Fertig</button><button class="primary" onclick="openQuestionnaire(0)">Antworten ändern</button></div>`);
}
function openContinenceInfo(){
 show(`<div class="qstep">Information</div><h2>Harninkontinenz: Hauptformen &amp; Alltagstipps</h2>
 <div class="info-block"><h3>Belastungsinkontinenz</h3><p>Urinverlust tritt typischerweise bei körperlicher Belastung auf, zum Beispiel beim Heben, Tragen, Sport sowie beim Niesen, Husten oder Lachen. Das zugrunde liegende Protokoll beschreibt eine Schwäche des Blasenschließmechanismus als wesentlichen Zusammenhang.</p></div>
 <div class="info-block"><h3>Harndranginkontinenz</h3><p>Hier stehen starker Harndrang, häufiges Wasserlassen und gegebenenfalls dranghafter Urinverlust im Vordergrund. Das Protokoll nennt unter anderem eine Überaktivität des Blasenmuskels sowie weitere mögliche medizinische Ursachen.</p></div>
 <div class="info-block"><h3>Tipps aus dem Protokoll</h3><ul><li>Harndrang nicht immer sofort nachgeben, sondern – sofern individuell möglich – kurz abwarten, bis er nachlässt.</li><li>Ein Toiletten- und Trinkprotokoll führen und Veränderungen mit der behandelnden Ärztin oder dem behandelnden Arzt besprechen.</li><li>Beckenbodentraining kann zur Stärkung des Schließmechanismus eingesetzt werden.</li><li>Das Protokoll empfiehlt ausreichendes Trinken und eine ausgewogene, ballaststoffreiche Ernährung.</li></ul></div>
 <p class="medical-note"><b>Wichtig:</b> Diese Hinweise stammen aus der zugrunde liegenden Patienteninformation und sind keine individuelle Therapieempfehlung. Trinkmenge, Blasentraining und Behandlung sollten bei Erkrankungen oder Beschwerden ärztlich abgestimmt werden.</p>
 <div class="sheetfooter"><button class="primary" onclick="openSettings()">Fertig</button></div>`);
}
function confirmResetDiary(){
 show(`<h2>Tagebuch wirklich löschen?</h2><p class="resetlead">Alle Einträge und Nachtruhe-Daten dieses Miktionstagebuchs werden dauerhaft von diesem Gerät gelöscht.</p><p class="sub">Die Dokumentationsdauer bleibt erhalten. Anschließend beginnt ein neues Tagebuch mit <b>Tag 1</b>.</p><div class="field"><button class="backupbtn" onclick="exportData()">Vorher Sicherung exportieren</button></div><div class="resetactions"><button onclick="openSettings()">Abbrechen</button><button class="danger resetdanger" onclick="resetDiary()">Endgültig löschen</button></div>`)
}
function resetDiary(){
 const keepDays=(db.settings&&db.settings.days)||3;
 const today=new Date().toISOString().slice(0,10);
 db={start:today,entries:[],sleep:{},questionnaire:{},settings:{days:keepDays}};
 selectedDate=today;
 save();
 closeModal();
 showView('today');
 render();
 toast('Neues Miktionstagebuch gestartet');
}
function saveSettings(){
 db.settings.days=+days.value;db.start=start.value||db.start;
 let f=importFile.files[0]; if(f){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();closeModal()}catch(e){toast('Sicherung ungültig')}};r.readAsText(f);return}
 closeModal();save()
}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
render();
</script>
</body></html>
